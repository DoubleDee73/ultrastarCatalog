spring.thymeleaf.cache=false
spring.thymeleaf.templates_root=src/main/resources/templates/
app.version=@project.version@
# Translations: messages.properties (English, default) and messages_<lang>.properties
# The language is taken from the browser (Accept-Language header).
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
# CSS/JS URLs contain a hash of the file (e.g. /css/styles-1a2b3c.css): after an update,
# browsers and phones load the new version instead of an old one kept in their cache.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**
