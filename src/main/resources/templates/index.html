<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <title th:text="#{page.title}">Karaoke List</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}">
    <!-- Flags of the "Language" filter (SVG, displayed the same on every system) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
    <link rel="icon" type="image/png" sizes="16x16" href="/ico/ultrastarCatalog-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/ico/ultrastarCatalog-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/ico/ultrastarCatalog-48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/ico/ultrastarCatalog-192.png">
    <link href="https://fonts.googleapis.com/css?family=Fjalla+One&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/75aad18f9f.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
    <script th:src="@{/js/jQuery.loadScroll.js}"></script>
    <script th:src="@{/js/transition.js}"></script>
    <script th:inline="javascript">
        var playerLabels = {
            play: /*[[#{player.play}]]*/ 'Play',
            pause: /*[[#{player.pause}]]*/ 'Pause'
        };
        var playlistLabels = {
            added: /*[[#{playlist.added}]]*/ 'Added to "{0}"',
            already: /*[[#{playlist.already}]]*/ 'Already in "{0}"',
            error: /*[[#{playlist.error}]]*/ 'Could not add the song',
            loading: /*[[#{playlist.loading}]]*/ 'Loading...',
            choose: /*[[#{playlist.choose}]]*/ 'Choose a playlist'
        };
        var catalogLabels = {
            found: /*[[#{list.found}]]*/ '{0} songs found.'
        };
    </script>
    <script th:src="@{/js/player.js}"></script>
    <script th:src="@{/js/playlist.js}"></script>
    <script th:src="@{/js/filters.js}"></script>
    <script>
        // "i" button of the song cards (and "Artist : Title" in the list): shows the song information popup
        function openSongInfo(event, btn) {
            event.stopPropagation();
            event.preventDefault();
            var songId = btn.getAttribute('data-songid');
            $.ajax({url: '/songinfo/' + encodeURIComponent(songId)}).done(function (content) {
                $('#modalContent').html(content);
                document.getElementById('modalLayer').style.display = 'block';
            });
        }
        function closeModal() {
            document.getElementById('modalLayer').style.display = 'none';
        }
        // Click on the dark background or Escape key: close the popup
        window.onclick = function(event) {
            if (event.target == document.getElementById('modalLayer')) {
                closeModal();
            }
        }
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
        function toggleFavorite(event, icon) {
            event.stopPropagation();
            const card = icon.closest(".flip-card-inner");
            const songId = card.getAttribute("data-songid");
            let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
            const index = favorites.indexOf(songId);
            if (index === -1) {
              favorites.push(songId);
              icon.classList.remove("fa-regular");
              icon.classList.add("fa-solid");
            } else {
              favorites.splice(index, 1);
              icon.classList.remove("fa-solid");
              icon.classList.add("fa-regular");
            }
            localStorage.setItem("favorites", JSON.stringify(favorites));
        }
        document.addEventListener("DOMContentLoaded", function () {
            const favorites = JSON.parse(localStorage.getItem("favorites")) || [];
            document.querySelectorAll(".flip-card-inner").forEach(card => {
                const icon = card.querySelector(".favorite-icon");
                if (favorites.includes(card.getAttribute("data-songid"))) {
                    icon.classList.remove("fa-regular");
                    icon.classList.add("fa-solid");
                }
            });
        });
    </script>
</head>
<body>
<header class="catalog-header">
    <!-- Search + current filters. The filter screens write their choices into the hidden fields. -->
    <form id="catalogForm" class="catalog-form" method="get" action="/">
        <div class="search-box">
            <input type="search" id="search" name="searchterm" autocomplete="off"
                   th:value="${searchterm}" th:placeholder="#{search.placeholder}"/>
            <button type="submit" class="search-submit" th:title="#{search.submit}"
                    th:attr="aria-label=#{search.submit}"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div id="hidden-language"><input type="hidden" name="language" th:each="v : ${selLanguages}" th:value="${v}"/></div>
        <div id="hidden-decade"><input type="hidden" name="decade" th:each="v : ${selDecades}" th:value="${v}"/></div>
        <div id="hidden-tags"><input type="hidden" name="tags" th:each="v : ${selTags}" th:value="${v}"/></div>
        <div id="hidden-playlist"><input type="hidden" name="playlist" th:each="v : ${selPlaylists}" th:value="${v}"/></div>
        <input type="hidden" id="f-sort" name="sort" th:value="${sort}"/>
        <input type="hidden" id="f-dir" name="dir" th:value="${dir}"/>
        <input type="hidden" id="f-view" name="view" value="list" th:disabled="${view != 'list'}"/>
        <input type="hidden" id="f-fav" name="fav" value="1" th:disabled="${!fav}"/>
    </form>

    <!-- Filters: each button opens a selection screen -->
    <div class="filter-bar">
        <button type="button" class="filter-pill" th:classappend="${!selLanguages.empty} ? 'active'"
                onclick="openFilter('language')"><i class="fa-solid fa-globe"></i><span
                th:text="#{filter.language}">Language</span><span class="pill-badge" th:unless="${selLanguages.empty}"
                th:text="${selLanguages.size()}">1</span></button>
        <button type="button" class="filter-pill" th:classappend="${!selDecades.empty} ? 'active'"
                onclick="openFilter('decade')"><i class="fa-solid fa-calendar-days"></i><span
                th:text="#{filter.decade}">Decade</span><span class="pill-badge" th:unless="${selDecades.empty}"
                th:text="${selDecades.size()}">1</span></button>
        <button type="button" class="filter-pill" th:classappend="${!selTags.empty} ? 'active'"
                onclick="openFilter('tags')"><i class="fa-solid fa-tags"></i><span
                th:text="#{filter.tags}">Tags</span><span class="pill-badge" th:unless="${selTags.empty}"
                th:text="${selTags.size()}">1</span></button>
        <button type="button" class="filter-pill" th:unless="${playlistOptions.empty}"
                th:classappend="${!selPlaylists.empty} ? 'active'"
                onclick="openFilter('playlist')"><i class="fa-solid fa-list-ul"></i><span
                th:text="#{filter.playlists}">Playlists</span><span class="pill-badge" th:unless="${selPlaylists.empty}"
                th:text="${selPlaylists.size()}">1</span></button>
        <button type="button" class="filter-pill favorites-pill" th:classappend="${fav} ? 'active'"
                onclick="toggleFavoritesFilter()"><i class="fa-solid fa-star"></i><span
                th:text="#{filter.favorites}">Favorites</span></button>
    </div>

    <!-- Sort, number of songs, grid / list -->
    <div class="toolbar">
        <!-- Two buttons: the sort field (menu) and the order (A→Z / Z→A, 1→9 / 9→1 for the year) -->
        <div class="sort-group" th:with="numeric=${sort == 'year'}">
            <div class="sort-wrapper">
                <button type="button" class="sort-button" onclick="toggleSortMenu(event)" th:title="#{sort.by}"
                        th:attr="aria-label=#{sort.by}">
                    <i th:class="${sortIcons.get(sort)}"></i><span th:text="#{sort.__${sort}__}">Artist</span><i
                        class="fa-solid fa-caret-down sort-caret"></i>
                </button>
                <div class="sort-menu" id="sortMenu" hidden>
                    <div class="sort-menu-title" th:text="#{sort.by}">Sort by</div>
                    <button type="button" class="sort-item" th:each="s : ${ {'artist','title','language','year'} }"
                            th:attr="data-sort=${s}" th:classappend="${s == sort} ? 'current'"
                            onclick="chooseSort(this.getAttribute('data-sort'))">
                        <i th:class="${sortIcons.get(s)} + ' sort-item-icon'"></i>
                        <span class="sort-item-label" th:text="#{sort.__${s}__}">Artist</span>
                        <i th:if="${s == sort}" class="fa-solid fa-check sort-item-check"></i>
                    </button>
                </div>
            </div>
            <button type="button" class="sort-button sort-order" onclick="toggleSortOrder()"
                    th:with="orderLabel=#{sort.order} + ' : ' + (${dir == 'desc'} ? #{sort.desc} : #{sort.asc})"
                    th:title="${orderLabel}" th:attr="aria-label=${orderLabel}">
                <i th:class="${numeric} ? (${dir == 'desc'} ? 'fa-solid fa-arrow-down-9-1' : 'fa-solid fa-arrow-up-1-9')
                                        : (${dir == 'desc'} ? 'fa-solid fa-arrow-down-z-a' : 'fa-solid fa-arrow-up-a-z')"></i>
            </button>
        </div>
        <div class="result-info">
            <span id="resultCount" class="result-count" th:text="#{list.found(${songs.size()})}">n songs found.</span>
            <a href="/" class="clear-filters" th:if="${hasFilters}" onclick="clearAllFilters(event)"><i
                    class="fa-solid fa-xmark"></i> <span th:text="#{filter.clearAll}">Clear filters</span></a>
        </div>
        <button type="button" class="view-toggle" onclick="toggleView()"
                th:title="${view == 'list'} ? #{view.grid} : #{view.list}"
                th:attr="aria-label=${view == 'list'} ? #{view.grid} : #{view.list}"><i
                th:class="${view == 'list'} ? 'fa-solid fa-table-cells-large' : 'fa-solid fa-list'"></i></button>
    </div>
</header>

<div class="main">
    <div id="emptyState" class="empty-state" th:hidden="${!songs.empty}">
        <span th:text="#{page.noSongs}"> No Songs Available </span>
    </div>
    <div th:unless="${view} == 'list'" class="flip-card" th:each="song : ${songs}">
        <div class="flip-card-inner" th:data-songid="${song.uid}">
            <button type="button" class="info-button"
                    th:data-songid="${song.uid}"
                    th:title="#{info.button}" th:attr="aria-label=#{info.button}"
                    onclick="openSongInfo(event, this)"><i class="fa-solid fa-info"></i></button>
            <i class="fa-regular fa-star favorite-icon" onclick="toggleFavorite(event, this)"></i>
            <button type="button" class="play-button" th:unless="${lite}"
                    th:data-songid="${song.uid}" th:data-start="${song.previewStartSeconds}"
                    th:title="#{player.play}" th:attr="aria-label=#{player.play}"
                    onclick="togglePlay(event, this)"><i class="fa-solid fa-play"></i></button>
            <button type="button" class="playlist-button" th:unless="${playlists.empty}"
                    th:data-songid="${song.uid}"
                    th:title="#{playlist.add}" th:attr="aria-label=#{playlist.add}"
                    onclick="togglePlaylistMenu(event, this)"><i class="fa-solid fa-plus"></i></button>
            <div class="flip-card-front">
                <img th:src="@{/images/} + ${song.uid} + '.jpg'" loading="lazy"/>
                <div class="text">
                    <h2 th:text=" ${song.artist}">Artist</h2>
                    <p th:text="${song.titleAndVariant}">Title</p>
                </div>
            </div>
        </div>
    </div>
    <table th:if="${view} == 'list'" th:unless="${songs.empty}" class="songlist">
        <thead>
        <tr>
            <th th:unless="${lite}" class="songlistHeader"></th>
            <th class="songlistHeader" th:text="#{list.artistAndTitle}">Artist : Title</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="song : ${songs}" class="songlist" th:data-songid="${song.uid}">
            <td th:unless="${lite}" class="play-cell">
                <button type="button" class="play-button-small"
                        th:data-songid="${song.uid}" th:data-start="${song.previewStartSeconds}"
                        th:title="#{player.play}" th:attr="aria-label=#{player.play}"
                        onclick="togglePlay(event, this)"><i class="fa-solid fa-play"></i></button>
            </td>
            <td>
                <!-- Click on "Artist : Title" opens the song information popup -->
                <button type="button" class="song-link" th:data-songid="${song.uid}"
                        th:title="#{info.button}" onclick="openSongInfo(event, this)"><span
                        class="song-link-artist" th:text="${song.artist}">Artist</span> : <span
                        th:text="${song.titleAndVariant}">Title</span></button>
            </td>
        </tr>
        </tbody>
    </table>
    <div id="modalLayer" class="modal">
        <div class="modal-content">
            <button type="button" class="modal-close" onclick="closeModal();"
                    th:title="#{info.close}" th:attr="aria-label=#{info.close}">&times;</button>
            <div id="modalContent"><span th:text="#{song.info}">Song-Info</span></div>
        </div>
    </div>
</div>

<!-- Selection screens of the filters (see filters.html) -->
<th:block th:replace="~{filters :: filterModal('language', #{filter.language}, 'fa-solid fa-globe', ${languageOptions}, ${selLanguages})}"></th:block>
<th:block th:replace="~{filters :: filterModal('decade', #{filter.decade}, 'fa-solid fa-calendar-days', ${decadeOptions}, ${selDecades})}"></th:block>
<th:block th:replace="~{filters :: filterModal('tags', #{filter.tags}, 'fa-solid fa-tags', ${tagOptions}, ${selTags})}"></th:block>
<th:block th:replace="~{filters :: filterModal('playlist', #{filter.playlists}, 'fa-solid fa-list-ul', ${playlistOptions}, ${selPlaylists})}"></th:block>
</body>
</html>
